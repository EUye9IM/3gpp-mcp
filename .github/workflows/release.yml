name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/ ./cmd/3gpp-mcp/

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar czf 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz 3gpp-mcp
          shasum -a 256 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          mv 3gpp-mcp 3gpp-mcp.exe
          zip 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.zip 3gpp-mcp.exe
          shasum -a 256 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.zip > 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3gpp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
